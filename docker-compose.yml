services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cricket
      MYSQL_USER: cricket
      MYSQL_PASSWORD: cricket
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql,redis,simulate
      DB_URL: jdbc:mysql://mysql:3306/cricket
      DB_USER: cricket
      DB_PASSWORD: cricket
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
