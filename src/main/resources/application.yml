# Default profile: zero setup (H2 in-memory, in-memory cache).
spring:
  datasource:
    url: jdbc:h2:mem:cricket;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

cricket:
  rate-limit:
    per-second: 50

simulator:
  delay-ms: 800
  overs: 5

---
# Run with: --spring.profiles.active=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cricket}
    username: ${DB_USER:cricket}
    password: ${DB_PASSWORD:cricket}

---
# Run with: --spring.profiles.active=mysql,redis
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
