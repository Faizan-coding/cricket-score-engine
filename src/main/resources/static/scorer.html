<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Scorer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6a7280; --accent:#0a7d4f; --danger:#c0392b; --border:#d9dde3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1b1e26; --text:#eceef2; --muted:#9aa3b2; --accent:#3ddc97; --danger:#ff7b6b; --border:#2f3440; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:520px; margin:0 auto; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  button { padding:12px 8px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.wicket { color:var(--danger); border-color:var(--danger); }
  .score { font-size:44px; font-weight:700; }
  .meta { color:var(--muted); font-size:14px; }
  #msg { font-size:13px; min-height:18px; }
  .ok { color:var(--accent); } .err { color:var(--danger); }
  a { color:var(--accent); }
  .result { margin-top:10px; padding:10px; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; text-align:center; }
  button:disabled { opacity:.45; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cricket Scorer</h1>
  <div class="meta">Team A bats first. The target and the winner are worked out automatically.</div>

  <div class="card">
    <h2>1. Match</h2>
    <div class="grid2">
      <div><label>Team A (bats first)</label><input id="teamA" value="India"></div>
      <div><label>Team B (chases)</label><input id="teamB" value="Australia"></div>
      <div><label>Overs</label><input id="overs" type="number" min="1" max="50" value="5"></div>
      <div><label>Match ID</label><input id="matchId" type="number" placeholder="auto"></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <button class="primary" onclick="createMatch()">Create &amp; start match</button>
      <button onclick="loadMatch()">Load existing</button>
    </div>
  </div>

  <div class="card">
    <div class="meta" id="teams">No match loaded</div>
    <div class="score" id="score">–</div>
    <div class="meta" id="detail"></div>
    <div class="meta" id="inn"></div>
    <div id="result" class="result" hidden></div>
    <div class="meta"><a id="viewLink" href="#" target="_blank" hidden>Open live viewer</a></div>
  </div>

  <div class="card" id="ballCard">
    <h2>2. Score the ball</h2>
    <div class="grid3">
      <button onclick="ball('RUNS',0)">0</button>
      <button onclick="ball('RUNS',1)">1</button>
      <button onclick="ball('RUNS',2)">2</button>
      <button onclick="ball('RUNS',3)">3</button>
      <button onclick="ball('RUNS',4)">4</button>
      <button onclick="ball('RUNS',6)">6</button>
      <button class="wicket" onclick="ball('WICKET',0)">Wicket</button>
    </div>
    <h2 style="margin-top:16px">Extras</h2>
    <label>Extra runs (wide: 0-4, no-ball: runs off the bat, bye / leg bye: 1-4)</label>
    <select id="extraRuns">
      <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option>
    </select>
    <div class="grid2" style="margin-top:10px">
      <button onclick="ball('WIDE')">Wide</button>
      <button onclick="ball('NO_BALL')">No ball</button>
      <button onclick="ball('BYE')">Bye</button>
      <button onclick="ball('LEG_BYE')">Leg bye</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const say = (text, ok) => { $('msg').textContent = text; $('msg').className = ok ? 'ok' : 'err'; };

  async function api(method, path, body) {
    const res = await fetch('/api/matches' + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    return data;
  }

  function show(s) {
    $('teams').textContent = s.teamA + ' vs ' + s.teamB + ' · ' + s.status;
    $('score').textContent = s.runs + '/' + s.wickets;
    $('detail').textContent = 'Overs ' + s.overs + ' / ' + s.oversLimit + ' · Run rate ' + s.runRate.toFixed(2) + ' · Extras ' + s.extras;
    let inn = s.status === 'COMPLETED' ? 'Match complete'
        : s.innings === 1 ? 'Innings 1 · ' + s.battingTeam + ' batting'
        : 'Innings 2 · ' + s.battingTeam + ' need ' + (s.target - s.runs) + ' from ' + (s.oversLimit * 6 - s.legalBalls) + ' balls (target ' + s.target + ')';
    if (s.firstInnings) inn += ' · ' + s.firstInnings.team + ' scored ' + s.firstInnings.runs + '/' + s.firstInnings.wickets;
    $('inn').textContent = inn;
    $('result').hidden = !s.result;
    if (s.result) $('result').textContent = '\u{1F3C6} ' + s.result;
    document.querySelectorAll('#ballCard button').forEach(b => b.disabled = s.status === 'COMPLETED');
    $('viewLink').href = '/?match=' + s.id;
    $('viewLink').hidden = false;
  }

  async function createMatch() {
    try {
      const m = await api('POST', '', {
        teamA: $('teamA').value, teamB: $('teamB').value, oversLimit: parseInt($('overs').value, 10)
      });
      $('matchId').value = m.id;
      show(await api('POST', '/' + m.id + '/start'));
      say('Match ' + m.id + ' is live. Score the first ball.', true);
    } catch (e) { say(e.message, false); }
  }

  async function loadMatch() {
    try {
      const id = $('matchId').value;
      if (!id) return say('Enter a match ID first', false);
      show(await api('GET', '/' + id));
      say('Loaded match ' + id, true);
    } catch (e) { say(e.message, false); }
  }

  async function ball(type, runs) {
    const id = $('matchId').value;
    if (!id) return say('Create or load a match first', false);
    if (runs === undefined) {
      runs = parseInt($('extraRuns').value, 10);
      if (type === 'BYE' || type === 'LEG_BYE') runs = Math.max(1, Math.min(runs, 4));
      if (type === 'WIDE') runs = Math.min(runs, 4);
    }
    try {
      const r = await api('POST', '/' + id + '/events', {
        eventId: crypto.randomUUID(), type: type, runs: runs
      });
      show(r.state);
      say(type + (runs ? ' (' + runs + ')' : '') + ' recorded', true);
    } catch (e) { say(e.message, false); }
  }
</script>
</body>
</html>
